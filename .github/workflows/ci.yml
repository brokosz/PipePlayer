name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # macos-15's default Xcode (16.x) ships Swift 6, which Package.swift's
      # tools-version 6.0 needs. macos-14 was retired, cancelling every job.

      - name: Build
        run: swift build

      - name: Test
        run: swift test
